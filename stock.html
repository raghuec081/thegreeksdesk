<meta property="og:title" content="The Greeks Desk | Stock Detail">
<meta property="og:description" content="Live quote, chart, and options context for a single stock or index on The Greeks Desk.">

<meta name="twitter:site" content="@thegreeksdesk6">
<meta name="twitter:title" content="The Greeks Desk | Stock Detail">
<meta name="twitter:description" content="Live quote, chart, and options context for a single stock or index on The Greeks Desk.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#22242C; --ink-2:#2B2E38; --parchment:#F3EFE7;
    --gold:#A98C61; --gold-bright:#C4A876;
    --gain:#3E8E75; --loss:#B5432F;
    --line: rgba(243,239,231,0.12); --text-dim: rgba(243,239,231,0.65);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--parchment);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}

  nav{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;
    padding:22px 6vw;position:sticky;top:0;z-index:50;
    background:rgba(34,36,44,0.88);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-size:20px;text-decoration:none;color:var(--parchment);white-space:nowrap;flex-shrink:0;}
  .brand .glyph{color:var(--gold-bright);font-size:22px;}
  .navlinks{display:flex;gap:32px;font-size:15px;color:var(--text-dim);flex-wrap:wrap;}
  .navlinks a{text-decoration:none;transition:color .2s;white-space:nowrap;}
  .navlinks a:hover{color:var(--gold-bright);}

  main{max-width:1000px;margin:0 auto;padding:60px 6vw;}
  .loading{color:var(--text-dim);padding:60px 0;text-align:center;}

  .header-row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px;margin-bottom:8px;}
  .ticker-name h1{font-size:34px;}
  .ticker-name .sym{color:var(--text-dim);font-size:15px;margin-left:10px;}
  .price-block{text-align:right;}
  .price-block .price{font-family:'IBM Plex Mono',monospace;font-size:36px;}
  .price-block .chg{font-family:'IBM Plex Mono',monospace;font-size:16px;margin-left:10px;}
  .chg.up{color:var(--gain);} .chg.down{color:var(--loss);}

  .chart-wrap{border:1px solid var(--line);padding:24px;margin-top:36px;background:var(--ink-2);}
  .chart-note{font-size:12px;color:var(--text-dim);margin-top:14px;}

  .range-bar-wrap{margin-top:10px;}
  .range-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
  .range-track{height:6px;background:var(--line);border-radius:3px;margin:8px 0;position:relative;}
  .range-fill{position:absolute;top:0;height:100%;background:var(--gold-bright);border-radius:3px;}
  .range-dot{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--parchment);border:2px solid var(--gold-bright);transform:translateX(-50%);}

  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:36px;}
  @media(max-width:700px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--ink);padding:20px 22px;}
  .stat .label{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);}
  .stat .value{font-family:'IBM Plex Mono',monospace;font-size:18px;margin-top:8px;}

  .news-section{margin-top:50px;}
  .section-head{display:flex;align-items:baseline;gap:16px;margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:18px;}
  .section-head .g{font-family:'Fraunces',serif;font-size:22px;color:var(--gold-bright);}
  .section-head h2{font-size:22px;}
  .news-item{padding:16px 0;border-bottom:1px solid var(--line);}
  .news-item:last-child{border-bottom:none;}
  .news-item a{text-decoration:none;color:var(--parchment);font-size:15px;line-height:1.5;}
  .news-item a:hover{color:var(--gold-bright);}
  .news-item .meta{color:var(--text-dim);font-size:12px;margin-top:6px;}

  footer{border-top:1px solid var(--line);padding:34px 6vw;margin-top:60px;}
  .disclaimer{max-width:820px;font-size:12px;line-height:1.7;color:var(--text-dim);}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="brand">
    <svg width="24" height="24" viewBox="0 0 90 90" style="flex-shrink:0;">
      <line x1="24" y1="20" x2="24" y2="66" stroke="#C4A876" stroke-width="7"/>
      <line x1="45" y1="20" x2="45" y2="66" stroke="#C4A876" stroke-width="7"/>
      <line x1="66" y1="20" x2="66" y2="66" stroke="#C4A876" stroke-width="7"/>
      <line x1="16" y1="20" x2="74" y2="20" stroke="#C4A876" stroke-width="7"/>
      <line x1="16" y1="70" x2="74" y2="70" stroke="#C4A876" stroke-width="7"/>
    </svg>
    The Greeks Desk
  </a>
  <div class="navlinks">
    <a href="learn.html">Modules</a>
    <a href="options-chain.html">Today's Chain</a>
    <a href="track-record.html">Track Record</a>
    <a href="about.html">About</a>
    <a href="index.html#newsletter">Newsletter</a>
  </div>
</nav>

<main id="main">
  <div class="loading">Loading…</div>
</main>

<footer>
  <div class="disclaimer">
    <strong>Educational purposes only.</strong> Data shown is delayed/indicative and for illustration, not personalised financial advice. Always do your own research or consult a regulated financial adviser before making investment decisions.
  </div>
</footer>

<script>
const params = new URLSearchParams(window.location.search);
const symbol = (params.get('symbol') || '').toUpperCase();
const type = (params.get('type') || 'stock').toLowerCase(); // 'stock' or 'index'

function fmtChg(c){
  const sign = c >= 0 ? '+' : '';
  return `${sign}${c.toFixed(2)}%`;
}

function rangePercent(value, low, high){
  if(low === null || high === null || high === low) return 50;
  return Math.max(0, Math.min(100, ((value - low) / (high - low)) * 100));
}

async function fetchChart(sym){
  try{
    const res = await fetch(`/api/chart?symbol=${encodeURIComponent(sym)}`);
    if(!res.ok) return null;
    const json = await res.json();
    if(json.error || !json.closes || json.closes.length < 2) return null;
    return json;
  }catch(e){
    return null;
  }
}

async function load(){
  const main = document.getElementById('main');
  if(!symbol){
    main.innerHTML = `<div class="loading">No symbol specified. <a href="index.html" style="color:var(--gold-bright)">Go back</a>.</div>`;
    return;
  }
  try{
    const mainEndpoint = type === 'index'
      ? `/api/index-quote?symbol=${encodeURIComponent(symbol)}`
      : `/api/stock?symbol=${encodeURIComponent(symbol)}`;

    const [mainRes, chart] = await Promise.all([
      fetch(mainEndpoint),
      fetchChart(symbol),
    ]);

    if(!mainRes.ok) throw new Error('bad response');
    const d = await mainRes.json();
    if(d.error) throw new Error(d.error);

    // Index quotes don't include company news, fall back to general market headlines instead.
    if(type === 'index' && (!d.news || d.news.length === 0)){
      try{
        const newsRes = await fetch('/api/news');
        if(newsRes.ok){
          const newsJson = await newsRes.json();
          d.news = newsJson.headlines || [];
        }
      }catch(e){ d.news = []; }
    }

    render(d, chart);
  }catch(e){
    main.innerHTML = `<div class="loading">Couldn't load data for ${symbol} right now.<br><span style="font-size:12px;">${e.message}</span></div>`;
  }
}

function render(d, chart){
  const cls = d.change >= 0 ? 'up' : 'down';
  const week52Pct = rangePercent(d.price, d.week52Low, d.week52High);
  const newsHeading = type === 'index' ? 'Market Headlines' : 'Related News';

  document.getElementById('main').innerHTML = `
    <div class="header-row">
      <div class="ticker-name">
        <h1>${d.name}<span class="sym">${d.symbol}</span></h1>
      </div>
      <div class="price-block">
        <span class="price">${d.price.toFixed(2)}</span>
        <span class="chg ${cls}">${d.change >= 0 ? '+' : ''}${d.change.toFixed(2)} (${fmtChg(d.changePct)})</span>
      </div>
    </div>

    <div class="chart-wrap">
      <canvas id="priceChart" height="90"></canvas>
      <div class="chart-note" id="chartNote"></div>
    </div>

    <div class="stats-grid">
      <div class="stat"><div class="label">Day Range</div><div class="value">${d.dayLow?.toFixed(2) ?? '-'} – ${d.dayHigh?.toFixed(2) ?? '-'}</div></div>
      <div class="stat"><div class="label">52-Week Range</div><div class="value">${d.week52Low?.toFixed(2) ?? '-'} – ${d.week52High?.toFixed(2) ?? '-'}</div></div>
      <div class="stat"><div class="label">Prev. Close</div><div class="value">${d.prevClose?.toFixed(2) ?? '-'}</div></div>
      <div class="stat"><div class="label">Market Cap</div><div class="value">${d.marketCap ? '$' + d.marketCap.toLocaleString() + 'M' : '-'}</div></div>
    </div>

    <div class="range-bar-wrap" style="margin-top:36px;">
      <div class="range-labels"><span>52W Low ${d.week52Low?.toFixed(2) ?? '-'}</span><span>52W High ${d.week52High?.toFixed(2) ?? '-'}</span></div>
      <div class="range-track"><div class="range-dot" style="left:${week52Pct}%"></div></div>
    </div>

    <div class="news-section">
      <div class="section-head"><span class="g">Ν</span><h2>${newsHeading}</h2></div>
      <div id="newsList">${
        d.news && d.news.length
          ? d.news.map(n => `
            <div class="news-item">
              <a href="${n.url}" target="_blank" rel="noopener">${n.headline}</a>
              <div class="meta">${n.source} · ${new Date(n.datetime * 1000).toLocaleDateString()}</div>
            </div>`).join('')
          : `<div class="news-item"><span style="color:var(--text-dim);font-size:14px;">No recent news found.</span></div>`
      }</div>
    </div>
  `;

  const note = document.getElementById('chartNote');
  if(chart && chart.closes && chart.closes.length > 1){
    const ctx = document.getElementById('priceChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: chart.dates.map(dt => new Date(dt).toLocaleDateString(undefined, {month:'short', day:'numeric'})),
        datasets: [{
          data: chart.closes,
          borderColor: '#D8B876',
          backgroundColor: 'rgba(216,184,118,0.08)',
          fill: true,
          tension: 0.15,
          pointRadius: 0,
          borderWidth: 2,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: 'rgba(243,239,231,0.5)', maxTicksLimit: 8 } },
          y: { grid: { color: 'rgba(243,239,231,0.08)' }, ticks: { color: 'rgba(243,239,231,0.5)' } }
        }
      }
    });
    note.textContent = '90-day price history.';
  } else {
    document.getElementById('priceChart').style.display = 'none';
    note.innerHTML = 'Historical chart unavailable right now. Showing day and 52-week range instead below.';
  }
}

load();
</script>

</body>
</html>
